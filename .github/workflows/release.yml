name: Build and Release

# Dual-boot pipeline: build the x4 (gh_release) firmware on a version tag,
# publish a standalone merged binary as a GitHub Release, and push the raw
# app image to the typeslate website for the dual-boot flasher.
# Only the gh_release (x3/x4) env is built — MicroSlate is x4-only for now.

on:
  push:
    tags:
      - 'v*'
  # Manual "Run workflow" button: builds and uploads the binaries as a private
  # downloadable artifact for flash-testing, WITHOUT creating a GitHub Release
  # or publishing to the website. Those steps are gated to tag pushes only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossPoint
        run: CROSSPOINT_RC_HASH="$(git rev-parse --short=7 HEAD)" pio run -e gh_release -j1

      - name: Merge standalone binary
        run: |
          pip install esptool
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" | head -1)
          esptool.py --chip esp32c3 merge_bin \
            --flash_mode dio --flash_size 16MB \
            -o crosspoint-${{ github.ref_name }}.bin \
            0x0     .pio/build/gh_release/bootloader.bin \
            0x8000  .pio/build/gh_release/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 .pio/build/gh_release/firmware.bin

      - name: Stage binaries for download
        run: |
          mkdir -p dist
          cp crosspoint-${{ github.ref_name }}.bin dist/
          # Raw app image — this is what gets written into the dual-boot OTA slot.
          cp .pio/build/gh_release/firmware.bin dist/crosspoint-app.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-firmware-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: crosspoint-${{ github.ref_name }}.bin
          generate_release_notes: true

      - name: Publish to typeslate website
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WEBSITE_PAT: ${{ secrets.WEBSITE_PAT }}
        run: |
          git clone https://x-access-token:${WEBSITE_PAT}@github.com/josh-websites/typeslate-website.git website
          mkdir -p website/tools/crosspoint/firmware
          cp crosspoint-${{ github.ref_name }}.bin website/tools/crosspoint/firmware/latest.bin
          cp .pio/build/gh_release/firmware.bin website/tools/crosspoint/firmware/app.bin
          echo '{"version":"${{ github.ref_name }}"}' > website/tools/crosspoint/firmware/version.json
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/crosspoint/firmware/
          git commit -m "Update CrossPoint firmware to ${{ github.ref_name }}"
          git push
